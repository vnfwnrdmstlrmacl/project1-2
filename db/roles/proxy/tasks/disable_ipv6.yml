---
- name: Disable IPv6 via sysctl (runtime + persistent)
  sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_set: yes
    state: present
    reload: yes
  loop:
    - net.ipv6.conf.all.disable_ipv6
    - net.ipv6.conf.default.disable_ipv6
    - net.ipv6.conf.lo.disable_ipv6

# 멀티 NIC + 같은 L2 구간에서 ARP flux 방지
- name: Prevent ARP flux (arp_ignore/arp_announce)
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { name: net.ipv4.conf.all.arp_ignore, value: "1" }
    - { name: net.ipv4.conf.all.arp_announce, value: "2" }
    - { name: net.ipv4.conf.default.arp_ignore, value: "1" }
    - { name: net.ipv4.conf.default.arp_announce, value: "2" }
